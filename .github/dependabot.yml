version: 2
updates:
  - package-ecosystem: npm
    directory: /backend/cloudflare
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: ['androidx.*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
